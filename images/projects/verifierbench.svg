<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">VerifierBench architecture overview</title>
  <desc id="desc">A diagram showing tasks flowing through ReAct and verifier-gated agents, transition verification, rollback, and paired metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b556e"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102033; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box-title { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-copy { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tag { font: 700 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f766e; letter-spacing: .02em; }
      .line { stroke: #3b556e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #9aa9ba; stroke-width: 2.5; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="620" rx="34" fill="url(#bg)"/>
  <text x="56" y="62" class="title">VerifierBench: measure whether self-correction really helps</text>
  <text x="56" y="92" class="subtitle">The bench treats the verifier as a fallible intervention, not magic. It counts both prevented failures and verifier-caused failures.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="145" width="220" height="128" rx="20" fill="#ffffff"/>
    <text x="82" y="181" class="box-title">1. Task world</text>
    <text x="82" y="211" class="box-copy">Deterministic UI state graph</text>
    <text x="82" y="234" class="box-copy">or benchmark adapter</text>
    <text x="82" y="257" class="box-copy">with reset/checkpoint hooks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="356" y="122" width="230" height="110" rx="20" fill="#fff7ed"/>
    <text x="382" y="158" class="box-title">ReAct baseline</text>
    <text x="382" y="188" class="box-copy">Same seed, task, and fault</text>
    <text x="382" y="211" class="box-copy">schedule; no verifier gate</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="356" y="288" width="230" height="136" rx="20" fill="#ecfeff"/>
    <text x="382" y="324" class="box-title">Verifier-gated agent</text>
    <text x="382" y="354" class="box-copy">Checks post-action UI state</text>
    <text x="382" y="377" class="box-copy">before continuing</text>
    <text x="382" y="400" class="box-copy">and can rollback/retry/wait</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="676" y="145" width="206" height="128" rx="20" fill="#f0fdf4"/>
    <text x="702" y="181" class="box-title">Transition truth</text>
    <text x="702" y="211" class="box-copy">No-change, wrong-state,</text>
    <text x="702" y="234" class="box-copy">delayed effect, drift,</text>
    <text x="702" y="257" class="box-copy">irreversible side effect</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="676" y="316" width="206" height="108" rx="20" fill="#eef2ff"/>
    <text x="702" y="352" class="box-title">Fallible verifier</text>
    <text x="702" y="382" class="box-copy">Confusion, calibration,</text>
    <text x="702" y="405" class="box-copy">false blocks, missed faults</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="444" y="476" width="250" height="94" rx="20" fill="#fff1f2"/>
    <text x="470" y="512" class="box-title">Rollback audit</text>
    <text x="470" y="542" class="box-copy">Did restore actually undo state,</text>
    <text x="470" y="565" class="box-copy">or was the action irreversible?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="202" width="128" height="186" rx="20" fill="#ffffff"/>
    <text x="952" y="238" class="box-title">Metrics</text>
    <text x="952" y="269" class="box-copy">success</text>
    <text x="952" y="292" class="box-copy">prevented</text>
    <text x="952" y="315" class="box-copy">induced</text>
    <text x="952" y="338" class="box-copy">net gain</text>
    <text x="952" y="361" class="box-copy">calls/cost</text>
  </g>

  <path class="line" d="M 276 209 C 315 209, 316 177, 356 177"/>
  <path class="line" d="M 276 209 C 320 209, 316 356, 356 356"/>
  <path class="line" d="M 586 177 C 620 177, 630 206, 676 206"/>
  <path class="line" d="M 586 356 C 628 356, 626 370, 676 370"/>
  <path class="soft-line" d="M 779 424 C 770 474, 722 520, 694 520"/>
  <path class="line" d="M 882 206 C 908 206, 904 294, 930 294"/>
  <path class="line" d="M 882 370 C 908 370, 904 294, 930 294"/>
  <path class="soft-line" d="M 444 520 C 352 500, 326 392, 356 356"/>

  <rect x="56" y="500" width="290" height="70" rx="18" fill="#e0f2fe"/>
  <text x="82" y="530" class="tag">KEY IDEA</text>
  <text x="82" y="554" class="box-copy">Compare matched episodes, not loose aggregate runs.</text>
</svg>
