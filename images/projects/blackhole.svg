<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">BlackHole Memory Gateway</title>
  <desc id="desc">Animated diagram showing large coding-agent context entering a local memory gateway and leaving as a compact LLM request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#080512"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.15" stop-color="#8df7ff"/>
      <stop offset="0.45" stop-color="#5f63ff"/>
      <stop offset="1" stop-color="#0b1026" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ce1e6"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff65c3"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c83ff" stroke-opacity="0.08"/>
    </pattern>
    <path id="leftPath" d="M270 285 C360 285 380 250 465 250"/>
    <path id="rightPath" d="M735 250 C825 250 840 285 930 285"/>
  </defs>

  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="28" fill="url(#grid)"/>
  <ellipse cx="600" cy="265" rx="310" ry="180" fill="url(#core)" opacity="0.14">
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="72" fill="#f7f8ff" font-size="38" font-weight="750" letter-spacing="1">BLACKHOLE</text>
    <text x="600" y="103" fill="#98a2c9" font-size="15" font-weight="600" letter-spacing="5">MEMORY GATEWAY</text>

    <g transform="translate(90 210)">
      <rect width="180" height="150" rx="24" fill="#111936" stroke="#45528a" stroke-width="2"/>
      <rect x="25" y="28" width="130" height="72" rx="10" fill="#080d20" stroke="#33406f"/>
      <path d="M43 48h60M43 64h92M43 80h72" stroke="#65dfe8" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
      <text x="90" y="125" fill="#f3f5ff" font-size="16" font-weight="700">CODING AGENT</text>
      <text x="90" y="145" fill="#8995c1" font-size="11">MASSIVE CONTEXT</text>
    </g>

    <g transform="translate(465 155)">
      <circle cx="135" cy="95" r="112" fill="#0a0d1b" stroke="url(#flow)" stroke-width="3" filter="url(#softGlow)">
        <animate attributeName="r" values="108;114;108" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="135" cy="95" r="82" fill="none" stroke="#7c64ff" stroke-width="2" stroke-dasharray="6 12" opacity="0.65">
        <animate attributeName="stroke-dashoffset" values="0;-180" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="135" cy="95" r="58" fill="url(#core)" filter="url(#glow)"/>
      <circle cx="135" cy="95" r="26" fill="#02030a"/>
      <path d="M113 87l13 13 31-32" fill="none" stroke="#dffeff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="135" y="228" fill="#f5f6ff" font-size="17" font-weight="750">SHRED · INDEX · RECALL</text>
      <text x="135" y="251" fill="#909ac2" font-size="12">RADIX TRIE + LOCAL SANDBOX</text>
    </g>

    <g transform="translate(930 210)">
      <rect width="180" height="150" rx="24" fill="#111936" stroke="#45528a" stroke-width="2"/>
      <circle cx="90" cy="61" r="34" fill="none" stroke="#ff6ac8" stroke-width="3"/>
      <circle cx="90" cy="61" r="19" fill="#ff6ac8" opacity="0.14"/>
      <path d="M77 61h26M90 48v26" stroke="#ffd6ef" stroke-width="3" stroke-linecap="round"/>
      <text x="90" y="125" fill="#f3f5ff" font-size="16" font-weight="700">LLM PROVIDER</text>
      <text x="90" y="145" fill="#8995c1" font-size="11">LEAN CONTEXT</text>
    </g>

    <path d="M270 285 C360 285 380 250 465 250" fill="none" stroke="#27345f" stroke-width="3"/>
    <path d="M735 250 C825 250 840 285 930 285" fill="none" stroke="#27345f" stroke-width="3"/>

    <g fill="#63e6eb" filter="url(#softGlow)">
      <circle r="6"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#leftPath"/></animateMotion></circle>
      <circle r="4" opacity="0.7"><animateMotion dur="2.8s" begin="-0.9s" repeatCount="indefinite"><mpath href="#leftPath"/></animateMotion></circle>
      <circle r="3" opacity="0.5"><animateMotion dur="2.8s" begin="-1.8s" repeatCount="indefinite"><mpath href="#leftPath"/></animateMotion></circle>
    </g>
    <g fill="#ff6ac8" filter="url(#softGlow)">
      <circle r="5"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#rightPath"/></animateMotion></circle>
      <circle r="3" opacity="0.65"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite"><mpath href="#rightPath"/></animateMotion></circle>
    </g>

    <g transform="translate(365 407)">
      <rect width="470" height="48" rx="24" fill="#10172f" stroke="#303c6a"/>
      <text x="235" y="30" fill="#cbd2f0" font-size="14" font-weight="600">
        <tspan fill="#69e4e8">STORE LOCALLY</tspan><tspan>  •  </tspan><tspan fill="#a98cff">QUERY PRECISELY</tspan><tspan>  •  </tspan><tspan fill="#ff82cf">SEND LESS</tspan>
      </text>
    </g>
  </g>

  <g fill="#ffffff">
    <circle cx="74" cy="78" r="1" opacity="0.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="96" r="1.5" opacity="0.6"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1045" cy="421" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="430" r="1.5" opacity="0.4"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
